<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Mark Institute of Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- Tech Background -->
  <div class="stage">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="scanline"></div>
    <canvas id="net"></canvas>
  </div>

<div class="topbar"></div>

<section class="page-header">
  <p class="kicker">contact.html</p>
  <h1>Get in touch</h1>
</section>
<div class="contact-body">
  <div class="contact-card">
    <p>Questions about admissions, programs, or this project itself? Send a message &mdash; submitting opens your email app with everything filled in.</p>
    <form id="contactForm">
      <div class="field"><label>your name</label><input type="text" id="cName" placeholder="Your name" required></div>
      <div class="field"><label>subject</label><input type="text" id="cSubject" value="Mark Institute of Technology — Inquiry" required></div>
      <div class="field"><label>message</label><textarea id="cMessage" placeholder="Write your message..."></textarea></div>
      <button type="submit" class="send-btn">Send email &#9656;</button>
    </form>
  </div>
</div>

<footer>Mark Institute of Technology &mdash; a fictional college built for the JavaScript Basic Course project</footer>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('cName').value;
    const subject = document.getElementById('cSubject').value;
    const message = document.getElementById('cMessage').value;
    const body = 'From: ' + name + '\n\n' + message;
    const mailto = 'mailto:arve.baes@ctu.edu.ph?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    window.location.href = mailto;
  });
</script>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/tech-bg.js"></script>
</body>
</html>
